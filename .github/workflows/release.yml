name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build, release & submit
    runs-on: ubuntu-latest
    env:
      SUBMIT_KEYS: ${{ secrets.SUBMIT_KEYS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG_VERSION package.json=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION. Bump package.json before tagging."
            exit 1
          fi

      - name: Build extension
        run: bun run build

      - name: Package extension
        run: bun run package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/chrome-mv3-prod.zip
          generate_release_notes: true

      - name: Submit to Chrome Web Store (BPP)
        if: ${{ env.SUBMIT_KEYS != '' }}
        uses: PlasmoHQ/bpp@v3.8.0
        with:
          keys: ${{ secrets.SUBMIT_KEYS }}
          artifact: build/chrome-mv3-prod.zip
